<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const resolveTheme = (mode) => {
          if (mode === 'light' || mode === 'dark') {
            return mode;
          }
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        };

        try {
          const persisted = localStorage.getItem('theme-store');
          const parsed = persisted ? JSON.parse(persisted) : null;
          const mode = parsed?.state?.mode ?? 'system';
          document.documentElement.setAttribute('data-theme', resolveTheme(mode));
        } catch {
          document.documentElement.setAttribute('data-theme', resolveTheme('system'));
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTeroid</title>

    <style>
      /* ─── App Preloader ──────────────────────────────────────────────────
         Shown while JS loads. React removes it on mount via main.tsx.
         Uses only CSS — no JS dependency, works even if bundle fails to load.
      ──────────────────────────────────────────────────────────────────── */
      :root {
        --pre-bg: #f5f5f5;
        --pre-muted: rgba(22, 26, 29, 0.14);
        --pre-strong: rgba(22, 26, 29, 0.84);
      }

      html[data-theme='dark'] {
        --pre-bg: #0d1117;
        --pre-muted: rgba(247, 247, 247, 0.16);
        --pre-strong: rgba(247, 247, 247, 0.84);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--pre-bg);
      }

      #app-preloader {
        position: fixed;
        inset: 0;
        background: var(--pre-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition:
          opacity 0.35s ease,
          visibility 0.35s ease;
      }

      #app-preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .pre-shell {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(320px, 88vw);
      }

      .pre-spinner {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        border: 8px solid var(--pre-muted);
        border-top-color: var(--pre-strong);
        animation: pre-spin 0.9s linear infinite;
      }

      @keyframes pre-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <!-- Static preloader — removed by React after mount (see main.tsx) -->
    <div id="app-preloader" aria-hidden="true" aria-label="Loading application">
      <div class="pre-shell">
        <div class="pre-spinner"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
